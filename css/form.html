<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="demo.html">
    <label for="name">NAME :</label>
    <input type="text" id="name" name="name" placeholder="please enter your name " required><br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email" required placeholder=" enter your email"><br>
    <label for="user">USER name:</label>
    <input type="text" name="user" id="user" placeholder="enter the username"><br>
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required placeholder="enter your password"
    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="requires at least 8 characters, one uppercase letter, one lowercase letter, one number, and one special chara">
    <br>
    <label for="age">Age</label>
    <input type="number" name="age" id="age"><br>
    <label for="file">Choose File :</label>
    <input type="file" id="file" name="file" multiple><br>
    <label for="area">About me</label>
    <textarea name="area" id="area"></textarea><br>
     <input type="submit" value="submit" step="1" min="18" max="60">
    </form>
</body>
</html>
